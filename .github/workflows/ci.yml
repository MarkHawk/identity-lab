name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: End-to-end (lab up, logins, break/fix every scenario)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # No LAN DNS on the runner: browsers and scripts use localhost.
      LAB_HOST: localhost
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate CA, certificates and secrets
        run: scripts/setup.sh

      - name: Run scripts/test.sh
        run: scripts/test.sh --fresh

      - name: Collect container logs
        if: always()
        run: docker compose logs --no-color --timestamps > test-results/compose.log 2>&1 || true

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: test-results/
          retention-days: 14
