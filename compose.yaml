# identity-lab -- Keycloak IdP with an OpenLDAP directory, plus SAML and OIDC sample
# apps, and a FreeRADIUS server with a NAS that authenticates against the directory.
# Run scripts/setup.sh first; it generates .env and certs/.
# An nginx reverse proxy publishes Keycloak and a second copy of each app on
# 8183-8185. A third copy of the OIDC RP (8186) reaches Keycloak only through
# a Squid egress proxy. The reverse proxy also publishes a fourth OIDC RP on
# 8187, which it reaches over plain HTTP. An API (8188) accepts Keycloak
# access tokens from the direct OIDC RP. On 8189 the reverse proxy answers
# only clients with a certificate (mutual TLS). Host ports are restricted to
# 8180-8189. LDAP, RADIUS and Squid publish no host port.

name: identity-lab

x-lab-env: &lab-env
  LAB_HOST: ${LAB_HOST:?run scripts/setup.sh}
  KC_PORT: ${KC_PORT}
  SAML_SP_PORT: ${SAML_SP_PORT}
  OIDC_RP_PORT: ${OIDC_RP_PORT}
  PROXY_KC_PORT: ${PROXY_KC_PORT:?run scripts/setup.sh}
  PROXY_SAML_SP_PORT: ${PROXY_SAML_SP_PORT}
  PROXY_OIDC_RP_PORT: ${PROXY_OIDC_RP_PORT}
  EGRESS_OIDC_RP_PORT: ${EGRESS_OIDC_RP_PORT:?run scripts/setup.sh}
  PROXY_EDGE_RP_PORT: ${PROXY_EDGE_RP_PORT:?run scripts/setup.sh}
  API_PORT: ${API_PORT:?run scripts/setup.sh}
  PROXY_MTLS_PORT: ${PROXY_MTLS_PORT:?run scripts/setup.sh}

# Settings shared by every copy of the OIDC RP.
x-oidc-rp-env: &oidc-rp-env
  <<: *lab-env
  PORT: "8182"
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
  OIDC_RP_SECRET_KEY: ${OIDC_RP_SECRET_KEY}
  OIDC_BACKCHANNEL_BASE: https://keycloak:8180
  REQUESTS_CA_BUNDLE: /etc/idlab/ca.crt

services:
  postgres:
    image: postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/setup.sh}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "keycloak", "-d", "keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # OpenLDAP directory that Keycloak federates users from. LDAPS on the
  # compose network only; seeded from ldap/*.ldif on first boot.
  ldap:
    build: ./ldap
    image: identity-lab/ldap:local
    user: "${LAB_UID}:0"
    environment:
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:?run scripts/setup.sh}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:?run scripts/setup.sh}
      RADIUS_LDAP_BIND_PASSWORD: ${RADIUS_LDAP_BIND_PASSWORD:?run scripts/setup.sh}
      DEMO_PASSWORD: ${DEMO_PASSWORD}
    volumes:
      - ldapdata:/var/lib/idlab-ldap
      - ./certs/ca.crt:/etc/idlab/ca.crt:ro
      - ./certs/ldap.crt:/etc/idlab/ldap.crt:ro
      - ./certs/ldap.key:/etc/idlab/ldap.key:ro
    healthcheck:
      # Anonymous whoami over LDAPS: proves slapd is up and TLS verifies.
      test: ["CMD", "ldapwhoami", "-x", "-H", "ldaps://ldap:1636"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # FreeRADIUS: PAP Access-Requests from the NAS, users checked against the
  # directory. UDP 1812/1813 on the compose networks only, no host port.
  radius:
    build: ./radius
    image: identity-lab/radius:local
    user: "${LAB_UID}:0"
    depends_on:
      ldap:
        condition: service_healthy
    environment:
      # Expanded by FreeRADIUS as $ENV{...} in clients.conf and mods/ldap.
      RADIUS_SECRET: ${RADIUS_SECRET:?run scripts/setup.sh}
      RADIUS_LDAP_BIND_PASSWORD: ${RADIUS_LDAP_BIND_PASSWORD:?run scripts/setup.sh}
    volumes:
      - ./certs/ca.crt:/etc/idlab/ca.crt:ro
    networks:
      - default
      - radius
    healthcheck:
      # Status-Server over loopback. The secret goes to radclient as a file
      # (process substitution), never on its command line.
      test:
        - CMD
        - bash
        - -c
        - >-
          radclient -q -r 1 -t 2 -S <(printenv RADIUS_SECRET) 127.0.0.1:1812 status
          <<<'Message-Authenticator = 0x00'
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # The lab's NAS (RADIUS client), like a switch or VPN gateway. It holds its
  # own copy of the shared secret in the nasdata volume; send a request with
  # `docker compose exec nas nas-auth <user>`. Its IP is fixed because the
  # server identifies clients by source address (radius/clients.conf).
  nas:
    build: ./nas
    image: identity-lab/nas:local
    user: "${LAB_UID}:0"
    init: true
    depends_on:
      radius:
        condition: service_healthy
    environment:
      # Only read on first boot, to seed /var/lib/nas/secret.
      RADIUS_SECRET: ${RADIUS_SECRET:?run scripts/setup.sh}
    volumes:
      - nasdata:/var/lib/nas
    networks:
      radius:
        ipv4_address: 172.30.181.10
    healthcheck:
      test: ["CMD", "test", "-s", "/var/lib/nas/secret"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4@sha256:82a77884f3af238beab1e7afd63b5f530e1b5c0590bd7aa60b40a40463e29b2c
    # Production mode (not start-dev). The realm is imported on first boot only;
    # after that, state lives in Postgres like a real deployment.
    command: ["start", "--import-realm"]
    user: "${LAB_UID}:0"
    depends_on:
      postgres:
        condition: service_healthy
      ldap:
        condition: service_healthy
    environment:
      <<: *lab-env
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Hostname only, not a URL: Keycloak takes the scheme and port from each
      # request, so it answers as https://LAB_HOST:8180 directly and as
      # https://LAB_HOST:8183 through the reverse proxy. The OIDC RP calls
      # https://keycloak:8180 on the compose network and rewrites the
      # endpoints it calls itself (OIDC_BACKCHANNEL_BASE in apps/oidc-rp).
      KC_HOSTNAME: ${LAB_HOST}
      # X-Forwarded-* headers are honoured only from the reverse proxy's
      # fixed address; from anyone else they are ignored.
      KC_PROXY_HEADERS: xforwarded
      KC_PROXY_TRUSTED_ADDRESSES: 172.30.182.10
      # Listen on 8180 inside the container too, so 8080 appears nowhere.
      KC_HTTP_ENABLED: "false"
      KC_HTTPS_PORT: "8180"
      KC_HTTPS_CERTIFICATE_FILE: /etc/idlab/tls.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /etc/idlab/tls.key
      # Trust the lab CA for outgoing TLS (LDAPS to the directory).
      KC_TRUSTSTORE_PATHS: /etc/idlab/ca.crt
      # Health endpoints on the (unpublished) management port, plain HTTP so
      # the healthcheck works without curl in the image.
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_MANAGEMENT_SCHEME: http
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      # Placeholders substituted into keycloak/idlab-realm.json at import.
      DEMO_PASSWORD: ${DEMO_PASSWORD}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_PROXIED_CLIENT_SECRET: ${OIDC_PROXIED_CLIENT_SECRET:?run scripts/setup.sh}
      OIDC_EGRESS_CLIENT_SECRET: ${OIDC_EGRESS_CLIENT_SECRET:?run scripts/setup.sh}
      OIDC_EDGE_CLIENT_SECRET: ${OIDC_EDGE_CLIENT_SECRET:?run scripts/setup.sh}
      SP_SIGNING_CERT: ${SP_SIGNING_CERT}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD}
    volumes:
      - ./keycloak/idlab-realm.json:/opt/keycloak/data/import/idlab-realm.json:ro
      - ./certs/ca.crt:/etc/idlab/ca.crt:ro
      - ./certs/tls.crt:/etc/idlab/tls.crt:ro
      - ./certs/tls.key:/etc/idlab/tls.key:ro
    networks:
      - default
      - proxy
    ports:
      - "${KC_PORT}:8180"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          head -n1 <&3 | grep -q ' 200 '
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    restart: unless-stopped

  saml-sp:
    build: ./apps/saml-sp
    image: identity-lab/saml-sp:local
    user: "${LAB_UID}:${LAB_UID}"
    depends_on:
      keycloak:
        condition: service_healthy
    environment: &saml-sp-env
      <<: *lab-env
      PORT: "8181"
      SAML_SP_SECRET_KEY: ${SAML_SP_SECRET_KEY}
      # IdP signing certificate(s) the SP trusts; written by scripts/pin-idp-cert.sh.
      IDP_CERT_FILE: /var/lib/idlab/state/idp-signing.pem
      # libfaketime: the offset in faketime.rc ("+0" normally) is re-read on
      # every clock call, so scenarios/clock-skew.sh can shift this
      # container's wall clock without a restart. The host clock is untouched.
      LD_PRELOAD: /usr/local/lib/faketime/libfaketime.so.1
      FAKETIME_TIMESTAMP_FILE: /var/lib/idlab/state/faketime.rc
      FAKETIME_NO_CACHE: "1"
      # Do not set FAKETIME_DONT_FAKE_MONOTONIC: with libfaketime 0.9.10 it
      # makes Python 3.13's time.sleep() fail with EINVAL.
    volumes: &saml-sp-volumes
      - ./certs/ca.crt:/etc/idlab/ca.crt:ro
      - ./certs/tls.crt:/etc/idlab/tls.crt:ro
      - ./certs/tls.key:/etc/idlab/tls.key:ro
      - ./certs/sp-signing.crt:/etc/idlab/sp-signing.crt:ro
      - ./certs/sp-signing.key:/etc/idlab/sp-signing.key:ro
      - ./.state/saml-sp:/var/lib/idlab/state:ro
    ports:
      - "${SAML_SP_PORT}:8181"
    healthcheck: &app-healthcheck
      test:
        - CMD
        - python
        - -c
        - >-
          import os, ssl, urllib.request;
          urllib.request.urlopen('https://localhost:' + os.environ['PORT'] + '/healthz',
          context=ssl.create_default_context(cafile='/etc/idlab/ca.crt'), timeout=3)
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  oidc-rp:
    build: ./apps/oidc-rp
    image: identity-lab/oidc-rp:local
    user: "${LAB_UID}:${LAB_UID}"
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      <<: *oidc-rp-env
      # Only this copy calls the API.
      OIDC_RP_API_URL: https://api:8188/v1/whoami
    volumes:
      - ./certs/ca.crt:/etc/idlab/ca.crt:ro
      - ./certs/tls.crt:/etc/idlab/tls.crt:ro
      - ./certs/tls.key:/etc/idlab/tls.key:ro
    ports:
      - "${OIDC_RP_PORT}:8182"
    healthcheck: *app-healthcheck
    restart: unless-stopped

  # API (resource server) that accepts Keycloak access tokens, on 8188. The
  # direct OIDC RP calls it with the user's access token ("Call the API" on
  # its debug page); it checks the signature against Keycloak's JWKS, the
  # issuer, the expiry and that the audience includes idlab-api
  # (scenarios/api-bearer-*.sh).
  api:
    build: ./apps/api
    image: identity-lab/api:local
    user: "${LAB_UID}:${LAB_UID}"
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      <<: *lab-env
      PORT: "8188"
      API_AUDIENCE: idlab-api
      REQUESTS_CA_BUNDLE: /etc/idlab/ca.crt
    volumes:
      - ./certs/ca.crt:/etc/idlab/ca.crt:ro
      - ./certs/tls.crt:/etc/idlab/tls.crt:ro
      - ./certs/tls.key:/etc/idlab/tls.key:ro
    ports:
      - "${API_PORT}:8188"
    healthcheck: *app-healthcheck
    restart: unless-stopped

  # Second copies of the apps, reachable only through the proxy. Same images
  # and settings; they know their public URLs as the proxy's ports, and
  # Keycloak has a client for each (keycloak/idlab-realm.json).
  saml-sp-proxied:
    build: ./apps/saml-sp
    image: identity-lab/saml-sp:local
    user: "${LAB_UID}:${LAB_UID}"
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      <<: *saml-sp-env
      KC_PORT: ${PROXY_KC_PORT}
      SAML_SP_PORT: ${PROXY_SAML_SP_PORT}
    volumes: *saml-sp-volumes
    networks:
      - proxy
    healthcheck: *app-healthcheck
    restart: unless-stopped

  oidc-rp-proxied:
    build: ./apps/oidc-rp
    image: identity-lab/oidc-rp:local
    user: "${LAB_UID}:${LAB_UID}"
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      <<: *oidc-rp-env
      KC_PORT: ${PROXY_KC_PORT}
      OIDC_RP_PORT: ${PROXY_OIDC_RP_PORT}
      OIDC_CLIENT_ID: oidc-rp-proxied
      OIDC_RP_SERVICE: oidc-rp-proxied
      OIDC_CLIENT_SECRET: ${OIDC_PROXIED_CLIENT_SECRET}
      # Back channel through the proxy too, so tokens carry the proxy's issuer.
      OIDC_BACKCHANNEL_BASE: https://proxy:8183
      # Seconds the callback is slowed by ("0" normally); see
      # scenarios/proxy-gateway-timeout.sh.
      OIDC_RP_DELAY_FILE: /var/lib/idlab/state/callback-delay
    volumes:
      - ./certs/ca.crt:/etc/idlab/ca.crt:ro
      - ./certs/tls.crt:/etc/idlab/tls.crt:ro
      - ./certs/tls.key:/etc/idlab/tls.key:ro
      - ./.state/oidc-rp-proxied:/var/lib/idlab/state:ro
    networks:
      - proxy
    healthcheck: *app-healthcheck
    restart: unless-stopped

  # Fourth copy of the OIDC RP, behind the proxy on 8187. TLS ends at the
  # proxy, which talks plain HTTP to it, like an app behind a load balancer;
  # the app takes the scheme from X-Forwarded-Proto and redirects anything
  # that looks like plain HTTP to https (scenarios/redirect-loop.sh).
  oidc-rp-edge:
    build: ./apps/oidc-rp
    image: identity-lab/oidc-rp:local
    user: "${LAB_UID}:${LAB_UID}"
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      <<: *oidc-rp-env
      KC_PORT: ${PROXY_KC_PORT}
      OIDC_RP_PORT: ${PROXY_EDGE_RP_PORT}
      OIDC_CLIENT_ID: oidc-rp-edge
      OIDC_RP_SERVICE: oidc-rp-edge
      OIDC_CLIENT_SECRET: ${OIDC_EDGE_CLIENT_SECRET}
      OIDC_BACKCHANNEL_BASE: https://proxy:8183
      OIDC_RP_TLS: "off"
      OIDC_RP_PROXY_HOPS: "1"
      OIDC_RP_FORCE_HTTPS: "1"
    volumes:
      - ./certs/ca.crt:/etc/idlab/ca.crt:ro
    networks:
      - proxy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          urllib.request.urlopen('http://localhost:' + os.environ['PORT'] + '/healthz', timeout=3)
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # nginx reverse proxy (proxy/nginx.conf). The settings the proxy-* scenarios
  # change are in .state/proxy/ (healthy defaults in proxy/defaults/, copied
  # by setup.sh); scenarios rewrite them and reload nginx. Fixed address,
  # because Keycloak trusts X-Forwarded-* only from it.
  proxy:
    # 1.30.6 was 6 days old when pinned, an exception to the two-week rule:
    # it fixes five CVEs, including CVE-2026-93479 (a buffer overflow when
    # evaluating variables, which affects request logging as used here).
    image: nginx:1.30.6-alpine@sha256:970364228b1e4f932abc22d321932816782cca8a20b85a77552a7cfe9acfb3b5
    user: "${LAB_UID}:0"
    # restart: nginx re-resolves upstreams only every 10s, so when compose
    # recreates one (new address) restart the proxy rather than 502 meanwhile.
    depends_on:
      keycloak:
        condition: service_healthy
        restart: true
      saml-sp-proxied:
        condition: service_healthy
        restart: true
      oidc-rp-proxied:
        condition: service_healthy
        restart: true
      oidc-rp-edge:
        condition: service_healthy
        restart: true
    # nginx with its logs passed through proxy/mask.awk (see proxy/run.sh).
    command: ["sh", "/etc/nginx/run.sh"]
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy/run.sh:/etc/nginx/run.sh:ro
      - ./proxy/mask.awk:/etc/nginx/mask.awk:ro
      - ./.state/proxy:/etc/nginx/idlab:ro
      - ./certs/ca.crt:/etc/idlab/ca.crt:ro
      - ./certs/tls.crt:/etc/idlab/tls.crt:ro
      - ./certs/tls.key:/etc/idlab/tls.key:ro
    networks:
      proxy:
        ipv4_address: 172.30.182.10
    ports:
      - "${PROXY_KC_PORT}:8183"
      - "${PROXY_SAML_SP_PORT}:8184"
      - "${PROXY_OIDC_RP_PORT}:8185"
      - "${PROXY_EDGE_RP_PORT}:8187"
      - "${PROXY_MTLS_PORT}:8189"
    healthcheck:
      # nginx itself, over verified TLS; never reaches an upstream.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "--cacert", "/etc/idlab/ca.crt", "https://localhost:8183/nginx-healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Squid egress proxy (squid/squid.conf), like a corporate forward proxy.
  # On the internal egress network with oidc-rp-egress, and on the default
  # network to reach Keycloak. The settings the egress scenarios change are
  # in .state/squid/ (healthy defaults in squid/defaults/, copied by
  # setup.sh); scenarios rewrite them and run `squid -k reconfigure`.
  squid:
    build: ./squid
    image: identity-lab/squid:local
    user: "${LAB_UID}:0"
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      # Hashed into the proxy's password file at start, then unset.
      EGRESS_PROXY_PASSWORD: ${EGRESS_PROXY_PASSWORD:?run scripts/setup.sh}
    volumes:
      - ./.state/squid:/etc/squid/idlab:ro
      - ./certs/ca.crt:/etc/idlab/ca.crt:ro
      - ./certs/squid-ca.crt:/etc/idlab/squid-ca.crt:ro
      - ./certs/squid-ca.key:/etc/idlab/squid-ca.key:ro
    # Squid's pid file and helper state live in /tmp; a tmpfs is empty on
    # every start, so a restart doesn't find a stale pid file and refuse to run.
    tmpfs:
      - /tmp
    networks:
      - default
      - egress
    healthcheck:
      # Squid is running and answers signals; says nothing about its policy,
      # so it stays healthy while a scenario is broken.
      test: ["CMD", "squid", "-k", "check", "-f", "/etc/squid/squid.conf"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Third copy of the OIDC RP, on a network whose only way out is Squid: its
  # back channel (discovery, token, userinfo, JWKS) goes to
  # https://keycloak:8180 as a CONNECT through the proxy, set by HTTPS_PROXY
  # and NO_PROXY in .state/oidc-rp-egress/proxy.env. The browser reaches it
  # on 8186 and Keycloak directly on 8180, like the direct app.
  oidc-rp-egress:
    build: ./apps/oidc-rp
    image: identity-lab/oidc-rp:local
    user: "${LAB_UID}:${LAB_UID}"
    depends_on:
      keycloak:
        condition: service_healthy
      squid:
        condition: service_healthy
    env_file: ./.state/oidc-rp-egress/proxy.env
    environment:
      <<: *oidc-rp-env
      OIDC_RP_PORT: ${EGRESS_OIDC_RP_PORT}
      OIDC_CLIENT_ID: oidc-rp-egress
      OIDC_RP_SERVICE: oidc-rp-egress
      OIDC_CLIENT_SECRET: ${OIDC_EGRESS_CLIENT_SECRET}
    volumes:
      - ./certs/ca.crt:/etc/idlab/ca.crt:ro
      - ./certs/tls.crt:/etc/idlab/tls.crt:ro
      - ./certs/tls.key:/etc/idlab/tls.key:ro
    networks:
      - egress
      - egress-edge
    ports:
      - "${EGRESS_OIDC_RP_PORT}:8182"
    healthcheck: *app-healthcheck
    restart: unless-stopped

  # Headless browser used by scripts/test.sh (docker compose run --rm tests ...).
  tests:
    profiles: ["test"]
    build: ./tests
    image: identity-lab/tests:local
    network_mode: host
    user: "${LAB_UID}:${LAB_UID}"
    environment:
      <<: *lab-env
      DEMO_PASSWORD: ${DEMO_PASSWORD}
      HOME: /tmp
    volumes:
      - ./certs/ca.crt:/etc/idlab/ca.crt:ro
      - ./test-results:/results

volumes:
  pgdata:
  ldapdata:
  nasdata:

networks:
  default:
  # RADIUS between the NAS and the server. Internal: no route off the host.
  # The subnet is fixed so clients.conf can name the NAS by IP; change both
  # if it clashes with a network you already have.
  radius:
    internal: true
    ipam:
      config:
        - subnet: 172.30.181.0/24
  # The proxy, Keycloak and the apps behind the proxy. Fixed subnet so the
  # proxy has a fixed address (KC_PROXY_TRUSTED_ADDRESSES); change both if
  # it clashes. Not internal: the proxy publishes ports.
  proxy:
    ipam:
      config:
        - subnet: 172.30.182.0/24
  # oidc-rp-egress and Squid. Internal, so the RP's only way to Keycloak is
  # the proxy, as on a server network with no direct route out. Fixed subnet
  # because squid.conf allows clients by source network; change both if it
  # clashes.
  egress:
    internal: true
    ipam:
      config:
        - subnet: 172.30.183.0/24
  # Only carries oidc-rp-egress's published port (Docker can't publish a port
  # from an internal network). Nothing else is on it, so it is no route to
  # Keycloak.
  egress-edge:
