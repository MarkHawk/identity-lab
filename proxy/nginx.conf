# identity-lab reverse proxy: nginx in front of Keycloak and a second copy of
# each sample app. TLS with the lab CA on both sides: browsers connect to
# https://LAB_HOST:8183-8185, and nginx verifies each upstream's certificate.
#
#   8183  Keycloak         -> keycloak:8180
#   8184  SAML SP          -> saml-sp-proxied:8181
#   8185  OIDC RP          -> oidc-rp-proxied:8182
#   8187  edge OIDC RP     -> oidc-rp-edge:8182, plain HTTP: TLS ends here
#   8189  mutual TLS route, answered by nginx: needs a client certificate
#
# The settings the proxy-* scenarios change are in /etc/nginx/idlab/
# (.state/proxy/ on the host; healthy defaults in proxy/defaults/). Scenarios
# rewrite a file there, then run `nginx -t && nginx -s reload`.
#
# Runs as LAB_UID, not root, so it can read the 0600 TLS key: hence the
# pid file and temp paths in /tmp and no "user" directive.

worker_processes 1;
pid /tmp/nginx.pid;
# notice: also logs reloads ("signal 1 (SIGHUP) received ... reconfiguring").
error_log /dev/stderr notice;

events {
    worker_connections 512;
}

http {
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    default_type application/octet-stream;
    server_tokens off;

    # One line per request, with what the upstream did: runbooks grep these.
    log_format idlab '$remote_addr "$request" $status $body_bytes_sent '
                     'host=$http_host upstream=$upstream_addr '
                     'upstream_status=$upstream_status '
                     'request_time=$request_time upstream_time=$upstream_response_time';
    access_log /dev/stdout idlab;
    # The mutual-TLS route's line: what nginx made of the client certificate.
    # ssl_client_verify is NONE (no certificate), SUCCESS, or FAILED:<reason>;
    # it is last because the reason has spaces in it.
    log_format idlab_mtls '$remote_addr "$request" $status $body_bytes_sent '
                          'host=$http_host client_dn="$ssl_client_s_dn" '
                          'client_not_after="$ssl_client_v_end" '
                          'ssl_client_verify=$ssl_client_verify';

    # Upstream containers get a new address when compose recreates them.
    # Re-resolve them through Docker's DNS instead of keeping the start-up one.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream keycloak {
        zone keycloak 64k;
        server keycloak:8180 resolve;
    }
    upstream saml_sp_proxied {
        zone saml_sp_proxied 64k;
        server saml-sp-proxied:8181 resolve;
    }
    upstream oidc_rp_proxied {
        zone oidc_rp_proxied 64k;
        server oidc-rp-proxied:8182 resolve;
    }
    upstream oidc_rp_edge {
        zone oidc_rp_edge 64k;
        server oidc-rp-edge:8182 resolve;
    }

    # Browser side.
    ssl_certificate     /etc/idlab/tls.crt;
    ssl_certificate_key /etc/idlab/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Upstream side: HTTPS, verified against the lab CA.
    proxy_http_version            1.1;
    proxy_ssl_protocols           TLSv1.2 TLSv1.3;
    proxy_ssl_trusted_certificate /etc/idlab/ca.crt;
    proxy_ssl_verify              on;
    proxy_ssl_verify_depth        2;
    proxy_ssl_server_name         on;

    # nginx answers 503 by default when it rejects a request for rate.
    limit_req_status 429;
    include /etc/nginx/idlab/rate-limit-zone.conf;

    # Keycloak.
    server {
        listen 8183 ssl;

        include /etc/nginx/idlab/forwarded-headers.conf;
        include /etc/nginx/idlab/kc-buffers.conf;
        proxy_ssl_name keycloak;

        # The proxy's own health check; never reaches Keycloak.
        location = /nginx-healthz {
            access_log off;
            return 200 "ok\n";
        }
        location /realms/ {
            include /etc/nginx/idlab/kc-maintenance.conf;
            include /etc/nginx/idlab/rate-limit.conf;
            proxy_pass https://keycloak;
        }
        location / {
            include /etc/nginx/idlab/kc-maintenance.conf;
            proxy_pass https://keycloak;
        }
    }

    # SAML SP. Host keeps the port: the SP checks the SAML Destination
    # against https://<Host>/saml/acs.
    server {
        listen 8184 ssl;

        location / {
            proxy_pass https://saml_sp_proxied;
            proxy_ssl_name saml-sp;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # OIDC RP. The callback normally answers in well under a second.
    server {
        listen 8185 ssl;

        location / {
            include /etc/nginx/idlab/oidc-rp-upstream.conf;
            proxy_ssl_name oidc-rp;
            proxy_read_timeout 5s;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Edge OIDC RP. TLS ends here and the app gets plain HTTP, as behind most
    # load balancers: it learns the browser used https only from
    # X-Forwarded-Proto, and redirects anything else to https. A location
    # that sets any proxy_set_header of its own inherits none of these.
    server {
        listen 8187 ssl;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location / {
            include /etc/nginx/idlab/edge-location.conf;
            proxy_pass http://oidc_rp_edge;
        }
    }

    # Mutual TLS: a route for partner systems that must present a client
    # certificate signed by the lab CA, like a device or B2B API endpoint.
    # nginx answers itself with what it verified; there is no upstream. With
    # ssl_verify_client on, the TLS handshake completes even without a valid
    # certificate, and nginx then answers 400 (internally 496 for no
    # certificate, 495 for one that fails verification).
    server {
        listen 8189 ssl;

        ssl_client_certificate /etc/idlab/ca.crt;
        ssl_verify_client      on;
        ssl_verify_depth       2;

        access_log /dev/stdout idlab_mtls;
        # info: nginx logs why it refused a client certificate at this level.
        error_log  /dev/stderr info;

        location = / {
            default_type application/json;
            return 200 '{"client_certificate":"accepted","subject":"$ssl_client_s_dn","not_after":"$ssl_client_v_end"}\n';
        }
        location / {
            return 404;
        }
    }
}
