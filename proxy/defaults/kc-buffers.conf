# Room for Keycloak's response headers, which carry its session cookies.
# Measured at about 2 KB for the login page (one cookie alone is over 1 KB),
# growing with long redirect URIs, many scopes and bigger sessions; nginx's
# default (4k on most systems) leaves little headroom.
# Healthy default; scenarios/proxy-header-too-large.sh rewrites the copy in .state/proxy/.
proxy_buffer_size       16k;
proxy_buffers           8 16k;
proxy_busy_buffers_size 32k;
