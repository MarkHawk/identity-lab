# Headers the proxy sends to Keycloak. Keycloak builds its own URLs (issuer,
# login form, redirects) from X-Forwarded-Proto and X-Forwarded-Port, and
# trusts them only from the proxy's address (KC_PROXY_TRUSTED_ADDRESSES).
# Healthy default; scenarios/proxy-forwarded-headers.sh rewrites the copy in .state/proxy/.
proxy_set_header Host              $http_host;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;
