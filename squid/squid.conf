# identity-lab egress proxy: Squid between oidc-rp-egress and Keycloak, like
# a corporate forward proxy. The RP's network (egress, 172.30.183.0/24) is
# internal, so this is its only way to the IdP. Clients send CONNECT
# keycloak:8180 and Squid opens the tunnel.
#
# The settings the proxy-* egress scenarios change are in /etc/squid/idlab/
# (.state/squid/ on the host; healthy defaults in squid/defaults/). Scenarios
# rewrite a file there, then run `squid -k parse && squid -k reconfigure`.
#
# Runs as LAB_UID, not root, so it can read the 0600 CA key: hence the pid
# file and helper state in /tmp.

# The listening port is in tls.conf, because turning on TLS interception
# (ssl-bump) changes it. When Squid does intercept, it verifies Keycloak
# against the lab CA itself.
tls_outgoing_options cafile=/etc/idlab/ca.crt

pid_filename /tmp/squid.pid
coredump_dir /tmp
visible_hostname squid
# A pass-through proxy: nothing is cached.
cache deny all
cache_mem 8 MB

# Native squid log format on stdout, Squid's own log on stderr, so
# `docker compose logs squid` shows both.
access_log stdio:/dev/stdout squid
cache_log /dev/stderr
logfile_rotate 0

acl egress_clients src 172.30.183.0/24
acl SSL_ports port 8180
acl CONNECT method CONNECT

http_access deny CONNECT !SSL_ports
include /etc/squid/idlab/policy.conf
include /etc/squid/idlab/auth.conf
http_access allow egress_clients
http_access deny all

include /etc/squid/idlab/tls.conf
