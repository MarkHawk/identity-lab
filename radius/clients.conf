# RADIUS clients (NASes) allowed to send requests, identified by source IP.
# Each has a shared secret that must match the NAS's copy exactly.

# The lab NAS (the "nas" service). Its address is fixed in compose.yaml
# on the internal "radius" network.
client nas {
	ipaddr = 172.30.181.10
	shortname = nas
	nas_type = other
	secret = $ENV{RADIUS_SECRET}
	require_message_authenticator = yes
}

# Loopback, for the container's own health check (Status-Server only;
# the site rejects anything else from here).
client localhost {
	ipaddr = 127.0.0.1
	shortname = localhost
	secret = $ENV{RADIUS_SECRET}
	require_message_authenticator = yes
}
