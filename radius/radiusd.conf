# FreeRADIUS 3.2 main configuration for identity-lab: deliberately small.
# Secrets are never written here. $ENV{...} is expanded from the
# container's environment (from .env) when the server starts.

prefix = /usr
exec_prefix = /usr
sysconfdir = /etc
localstatedir = /var
sbindir = ${exec_prefix}/sbin
raddbdir = /etc/freeradius
confdir = ${raddbdir}
modconfdir = ${confdir}/mods-config
name = freeradius
libdir = /usr/lib/freeradius
# The container runs as LAB_UID, which can't write under /var/run.
run_dir = /tmp
pidfile = ${run_dir}/${name}.pid
logdir = /tmp

max_request_time = 30
cleanup_delay = 5
max_requests = 1024
hostname_lookups = no

log {
	destination = stdout
	colourise = no
	# One "Login OK" / "Login incorrect" line per Access-Request.
	auth = yes
	# Never log the password, right or wrong.
	auth_badpass = no
	auth_goodpass = no
}

security {
	# No user/group: the container already runs unprivileged (LAB_UID).
	allow_core_dumps = no
	max_attributes = 200
	reject_delay = 1
	# Lets the health check send Status-Server over loopback.
	status_server = yes
	# BlastRADIUS (CVE-2024-3596) protection, the 3.2.x default: every
	# Access-Request must carry a valid Message-Authenticator.
	require_message_authenticator = yes
	limit_proxy_state = yes
}

proxy_requests = no

$INCLUDE clients.conf

thread pool {
	start_servers = 2
	max_servers = 8
	min_spare_servers = 1
	max_spare_servers = 4
	max_requests_per_server = 0
	auto_limit_acct = no
}

modules {
	$INCLUDE mods/always
	$INCLUDE mods/ldap
}

$INCLUDE sites/default
